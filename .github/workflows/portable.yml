name: portable-core
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parser CSS and image smoke
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/parser_smoke.c src/aster.c src/platform.c -o /tmp/aster-smoke && /tmp/aster-smoke
      - name: Run parser smoke under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/parser_smoke.c src/aster.c src/platform.c -o /tmp/aster-sanitize && /tmp/aster-sanitize
      - name: Compile x86_64, AArch64 and RISC-V64 cores
        run: make check-all
