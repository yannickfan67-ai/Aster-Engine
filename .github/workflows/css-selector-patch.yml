name: css-selector-patch
on:
  push:
    branches: [feat/css-selectors-0.3.1-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[css-selector-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/css-selectors-0.3.1-20260909
      - name: Apply selector patch
        run: python3 tools/patch_css_selectors.py
      - name: Build and test
        run: make check-all
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/aster.h src/aster.c tests/parser_smoke.c README.md
          if git diff --cached --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git commit -m "aster: add class and id CSS selectors [css-selector-patch-applied]"
          git push origin HEAD:feat/css-selectors-0.3.1-20260909
