name: compound-class-patch
on:
  push:
    branches: [feat/compound-class-selectors-0.3.2-20260909]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compound-class-patch-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compound-class-selectors-0.3.2-20260909
      - name: Apply compound selector patch
        run: python3 tools/patch_compound_classes.py
      - name: Validate portable engine
        run: make check-all
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aster.c tests/parser_smoke.c
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "aster: support compound class selectors [compound-class-patch-applied]"
          git push origin HEAD:feat/compound-class-selectors-0.3.2-20260909
